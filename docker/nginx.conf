# Broderie Royale storefront — nginx runtime config.
#
# Listens on :80 (containerized); the host maps that to whatever public
# port you chose (8080 by default).
#
# Routing:  Astro builds with `format: directory`, so /boutique becomes
#           /boutique/index.html. We need a trailing-slash-tolerant try_files
#           chain so /boutique works as well as /boutique/.
#
# Compression:  gzip on for text MIME types. WebP/woff2 are already
#               compressed and gain ~nothing from gzip.
#
# Cache headers:  hashed assets under /_astro/ → 1 year immutable.
#                 fonts, images → 30 days.
#                 HTML → no-cache (we always want the latest links).

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Security response headers (HTTP-level).
  #
  # nginx `add_header` does NOT inherit into a child block that defines its
  # own add_header — so as soon as `location /` adds Cache-Control, every
  # server-level security header is silently dropped from the response.
  # Lighthouse credits header CSP but ignores the <meta> equivalent, so
  # we centralise everything here and re-import it inside the location
  # blocks below.
  #
  # We use the alpine-image trick of writing the headers into a snippet
  # via `set` + chained `add_header`s in each location; with stock nginx
  # there's no cleaner option short of headers-more. The redundancy is
  # documented and easy to keep in sync.
  set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https: https://erp.broderieroyale.com; media-src 'self'; connect-src 'self' https://erp.broderieroyale.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self';";

  # Default headers for asset/static responses. Cache rules per-location
  # also re-emit these so they don't get dropped.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy $csp always;
  # HSTS — enable once you're on HTTPS. Commented for the bare-IP staging.
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # --- gzip ---
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml+rss application/atom+xml image/svg+xml
    application/manifest+json font/ttf application/x-font-ttf;

  # Hide the nginx version in error pages / Server header.
  server_tokens off;

  # --- Cache policy by path ---

  # Astro's hashed bundles — immutable for a year.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # Fonts, brand assets — 30 days.
  location ~* \.(woff2?|ttf|otf|eot|webp|png|jpg|jpeg|gif|svg|ico|mp4|webm)$ {
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # CSS / non-hashed JS — cache 1 hour while serving fresh after changes.
  location ~* \.(css|js)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # robots / sitemap — short cache.
  location = /robots.txt { expires 1h; access_log off; try_files $uri =404; }
  location = /sitemap.xml { expires 1h; try_files $uri =404; }

  # --- HTML: never cache. Always serve the freshest links to hashed assets.
  # Re-emit the full security header stack here — without these the server-
  # level add_header values are silently dropped because this block adds
  # its own Cache-Control. CSP especially matters here since this is what
  # browsers (and Lighthouse) check on the document response.
  location ~* \.html$ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri =404;
  }

  # --- The main route handler ---
  # Try the URI exact -> URI/index.html -> URI/ (redirected to with slash) -> /404.html
  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Custom 404 — Astro built our themed page at /404/index.html
  error_page 404 /404/index.html;
  location = /404/index.html { internal; }

  # Block hidden dotfiles
  location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
}
